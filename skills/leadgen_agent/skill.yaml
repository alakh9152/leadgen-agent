name: leadgen_agent
description: |
  Runs Lead‑Gen v4 pipeline with optional FreeLLMAPI email generation.
inputs:
  market:
    type: string
    required: true
  overture:
    type: bool
    default: false
  weight:
    type: map
    default: {}
  country:
    type: string
    default: "IN"
  generate_email:
    type: bool
    default: false
  email_model:
    type: string
    default: "gpt-3.5-turbo"
  temperature:
    type: float
    default: 0.7
outputs:
  csv:
    type: string
  xlsx:
    type: string
  email_log:
    type: string
