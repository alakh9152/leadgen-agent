version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: leadgen_db
    environment:
      POSTGRES_USER: leadgen
      POSTGRES_PASSWORD: ${DB_PASSWORD:-leadgen123}
      POSTGRES_DB: leadgen
    volumes:
      - leadgen_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadgen"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: leadgen_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://leadgen:${DB_PASSWORD:-leadgen123}@db:5432/leadgen
      LEADGEN_SECRET_KEY: ${LEADGEN_SECRET_KEY:-change-this-secret-key}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@leadgen.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme}
      SERVER_PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - leadgen_outputs:/app/outputs
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: ../server/Dockerfile.frontend
    container_name: leadgen_web
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  leadgen_db_data:
  leadgen_outputs:
